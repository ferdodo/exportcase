services:

  binary-prebuild:
    build:
      context: ./binary
      target: binary-prebuild

  binary:
    build:
      context: ./binary
      additional_contexts:
        binary-prebuild: service:binary-prebuild

  package:
    build:
      context: ./package
      additional_contexts:
        exportcase-binary: service:binary

  ui:
    build: ui
    ports:
      - "127.0.0.1:26023:26023"

  website:
    build:
      context: website
      additional_contexts:
        exportcase-ui: service:ui
        exportcase-spec: service:spec
    ports:
      - "25032:25032"

  spec:
    build:
      context: spec
      additional_contexts:
        exportcase-package: service:package
